name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      # Устанавливаем зависимости из корневого requirements.txt (или pyproject.toml)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Если у тебя есть корневой requirements.txt с линтерами — используй его
          pip install -r requirements.txt
          # ИЛИ, если линтеры описаны в pyproject.toml, можно ставить так:
          # pip install .[dev]
          # или явно:
          # pip install black isort flake8 mypy pytest

      # Линтеры запускаем из корня проекта, чтобы они видели pyproject.toml
      - name: Run flake8
        run: |
          flake8 homework/hw1 --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 homework/hw1 --count --exit-zero --max-complexity=10 --max-line-length=88 --statistics

      - name: Run isort
        run: |
          isort --settings-path pyproject.toml --check-only homework/hw1

      - name: Run black
        run: |
          black --check homework/hw1

      - name: Run mypy
        run: |
          mypy homework/hw1

      - name: Run tests
        working-directory: homework/hw1
        run: |
          pytest -v
